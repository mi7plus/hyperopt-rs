[workspace]
resolver = "2"
members = [
    "hyperopt-core",
    "hyperopt-samplers",
    "hyperopt-pruners",
    "hyperopt-storage",
    "hyperopt",
    "hyperopt-viz",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["mi7plus"]
repository = "https://github.com/mi7plus/hyperopt-rs"
rust-version = "1.88"

[workspace.dependencies]
# Internal crates
hyperopt-core = { version = "0.1.0", path = "hyperopt-core" }
hyperopt-samplers = { version = "0.1.0", path = "hyperopt-samplers" }
hyperopt-pruners = { version = "0.1.0", path = "hyperopt-pruners" }
hyperopt-storage = { version = "0.1.0", path = "hyperopt-storage" }

# External
rand = "0.10"
tpe = "0.3"
rayon = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plotters = { version = "0.3", default-features = false, features = ["svg_backend", "line_series"] }

[profile.release]
opt-level = 3
